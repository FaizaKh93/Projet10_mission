[project]
name = "projet10-mission"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "easyocr>=1.7.2",
    "faiss-cpu==1.10.0",
    "fastapi>=0.141.1",
    "langchain==0.3.23",
    "logfire[fastapi]>=5.0",
    "mistralai>=1.9.11",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pillow>=9.0.0",
    "pydantic>=2.0",
    "pydantic-ai-slim[mistral]>=2.0",
    "pymupdf>=1.22.0",
    "pypdf2==3.0.1",
    "python-docx==1.1.2",
    "python-dotenv==1.1.0",
    "ragas>=0.4.3",
    "requests==2.32.3",
    "streamlit==1.44.1",
    "tqdm>=4.70.1",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Par défaut, "pytest" seul n'exécute pas les tests "api" (vrais appels payants à
# Mistral) : il faut les demander explicitement.
addopts = "-m 'not api'"
markers = [
    "api: tests appelant de vraies API externes payantes (Mistral) - lancer avec `pytest -m api`",
]
# Les deux suites se lancent dans leur propre processus :
#     uv run pytest && uv run pytest -m api

# --- Couverture de code -------------------------------------------------------------
# Mesurée sur src/ et app/ : le code du système. scripts/ et eval/ en sont exclus,
# ce sont des points d'entrée qu'on exécute, pas des modules qu'on teste unitairement.
[tool.coverage.run]
source = ["src", "app"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
# exclude_lines : lignes qu'il serait trompeur de compter comme non couvertes.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
show_missing = true
skip_covered = false
