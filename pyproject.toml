[project]
name = "projet10-mission"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "easyocr>=1.7.2",
    "faiss-cpu==1.10.0",
    "fastapi>=0.141.1",
    "langchain==0.3.23",
    "logfire[fastapi]>=5.0",
    "mistralai>=1.9.11",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pillow>=9.0.0",
    "pydantic>=2.0",
    "pydantic-ai-slim[mistral]>=2.0",
    "pymupdf>=1.22.0",
    "pypdf2==3.0.1",
    "python-docx==1.1.2",
    "python-dotenv==1.1.0",
    "ragas>=0.4.3",
    "requests==2.32.3",
    "streamlit==1.44.1",
    "tqdm>=4.70.1",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "statsmodels>=0.15.0",
]
docs = [
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Par défaut, "pytest" seul n'exécute ni les tests "api" (vrais appels payants à
# Mistral) ni les tests "slow" (chargement réel du modèle OCR) : il faut les
# demander explicitement.
addopts = "-m 'not api and not slow'"
# Les tests exercent des spans Logfire sans avoir appele logfire.configure() :
# le warning est attendu ici. Filtre sur le message, la classe vivant dans un
# module prive (logfire._internal).
filterwarnings = ["ignore:No logs or spans will be created"]
markers = [
    "api: tests appelant de vraies API externes payantes (Mistral) - lancer avec `pytest -m api`",
    "slow: tests chargeant un modèle lourd (EasyOCR) - lancer avec `pytest -m slow`",
]
# ATTENTION : ne pas lancer `pytest -m ""` (tout dans un seul processus). Sur Windows,
# importer torch (via easyocr, test `slow`) après que la pile d'évaluation (ragas,
# logfire) a été chargée fait planter l'interpréteur ("Fatal Python error: Aborted"),
# un conflit entre extensions natives. Chaque suite passe sans problème dans son
# propre processus :
#     uv run pytest && uv run pytest -m api && uv run pytest -m slow
# Le pipeline réel n'est pas concerné : scripts/index.py ne charge ni ragas ni logfire
# (ordre d'import vérifié).
