[project]
name = "projet10-mission"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "easyocr>=1.7.2",
    "faiss-cpu==1.10.0",
    "fastapi>=0.141.1",
    "langchain==0.3.23",
    "langchain-community==0.3.21",  # SQLDatabase : arrivait par ragas, outil d'évaluation
    "logfire[fastapi]>=5.0",
    "mistralai>=1.9.11",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pillow>=9.0.0",
    "pydantic>=2.0",
    "pydantic-ai-slim[mistral]>=2.0",
    "pymupdf>=1.22.0",
    "pypdf2==3.0.1",
    "python-docx==1.1.2",
    "python-dotenv==1.2.2",
    "ragas>=0.4.3",
    "requests==2.33.0",
    "sqlalchemy>=2.0",  # API 2.0 (DeclarativeBase, Mapped) : arrivait par langchain
    "streamlit==1.54.0",
    "tqdm>=4.70.1",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
# Le rapport MkDocs : hors des dépendances de production, qui n'ont pas à embarquer un
# générateur de site. `uv sync --group docs` pour l'installer.
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Par défaut, "pytest" seul n'exécute pas les tests "api" (vrais appels payants à
# Mistral) : il faut les demander explicitement.
addopts = "-m 'not api'"
markers = [
    "api: tests appelant de vraies API externes payantes (Mistral) - lancer avec `pytest -m api`",
]
# Les deux suites se lancent dans leur propre processus :
#     uv run pytest && uv run pytest -m api
#
# ATTENTION - conflit OpenMP. FAISS et PyTorch embarquent chacun leur runtime OpenMP
# (libomp140.x86_64.dll et libiomp5md.dll). Chargés dans le même processus sous Windows,
# OpenMP avorte l'interpréteur : « OMP: Error #15 », puis « Fatal Python error: Aborted ».
# Le contournement KMP_DUPLICATE_LIB_OK=TRUE est documenté comme non supporté et peut
# fausser les résultats en silence : on ne l'utilise pas.
# La parade est en amont : src/loading/loaders.py n'importe easyocr - donc torch - qu'au
# premier OCR réel, et jamais à l'import du module. Un test le vérifie dans un
# sous-processus (tests/test_loaders.py::test_import_ne_charge_pas_torch), parce que
# pytest importe TOUS les modules de test à la collecte, y compris ceux qu'il désélectionne.

# --- Couverture de code -------------------------------------------------------------
# Mesurée sur tout le code du dépôt, sans exception : src/, app/, scripts/ et eval/.
# eval/ y figure depuis que le harnais a des fonctions testables — construction du
# contexte transmis au juge, notation, reprise après une panne du juge. Sa boucle
# main() reste non couverte, car elle exige les deux API payantes : c'est ce qui
# explique son taux, et c'est préférable à une exclusion qui flatterait la moyenne.
[tool.coverage.run]
source = ["src", "app", "scripts", "eval"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
# exclude_lines : lignes qu'il serait trompeur de compter comme non couvertes.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
show_missing = true
skip_covered = false
