[project]
name = "projet10-mission"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "easyocr>=1.7.2",
    "faiss-cpu==1.10.0",
    "langchain==0.3.23",
    "langchain-openai>=0.3.35",
    "logfire>=5.0",
    "mistralai>=1.9.11",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pillow>=9.0.0",
    "pydantic>=2.0",
    "pydantic-ai-slim[mistral]>=2.0",
    "pymupdf>=1.22.0",
    "pypdf2==3.0.1",
    "python-docx==1.1.2",
    "python-dotenv==1.1.0",
    "ragas>=0.4.3",
    "requests==2.32.3",
    "streamlit==1.44.1",
    "streamlit-feedback==0.1.4",
    "tqdm>=4.70.1",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Par défaut, "pytest" seul n'exécute jamais les tests marqués "api" (vrais appels
# payants à Mistral) : il faut explicitement lancer "pytest -m api" pour ceux-là.
addopts = "-m 'not api'"
markers = [
    "api: tests appelant de vraies API externes payantes (Mistral) - lancer avec `pytest -m api`",
]
